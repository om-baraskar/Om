<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Landslide Intelligence & Monitoring Platform</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Sanjivani College</h1>
    <p>Landslide Intelligence & Monitoring Platform</p>

    <span id="connection">
        ● CONNECTING...
    </span>
</header>


<section class="risk">

    <h2>Current Risk</h2>

    <div id="riskLevel">
        LOADING
    </div>

    <p id="lastUpdate">
        Waiting for sensor data...
    </p>

</section>


<section class="sensors">

    <div class="card">
        <h3>🌧 Rain</h3>
        <strong id="rain">--</strong>
        <span>mm</span>
    </div>

    <div class="card">
        <h3>💧 Soil</h3>
        <strong id="soil">--</strong>
        <span>%</span>
    </div>

    <div class="card">
        <h3>📳 Vibration</h3>
        <strong id="vibration">--</strong>
        <span>/ 5</span>
    </div>

    <div class="card">
        <h3>📏 Distance</h3>
        <strong id="distance">--</strong>
        <span>cm</span>
    </div>

    <div class="card">
        <h3>🌡 Temperature</h3>
        <strong id="temperature">--</strong>
        <span>°C</span>
    </div>

    <div class="card">
        <h3>💨 Humidity</h3>
        <strong id="humidity">--</strong>
        <span>%</span>
    </div>

</section>


<section class="photo">

    <h2>📷 Report Site Condition</h2>

    <input
        type="file"
        id="photo"
        accept="image/*"
        capture="environment">

    <textarea
        id="description"
        placeholder="Describe the site condition...">
    </textarea>

    <button onclick="uploadPhoto()">
        SUBMIT PHOTO
    </button>

</section>


<footer>
    Developed by Om Baraskar
</footer>


<script src="js/thingspeak.js"></script>
<script src="js/upload.js"></script>

</body>
</html>
