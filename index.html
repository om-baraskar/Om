<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanjivani Smart Landslide Early Warning System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#dff4ff;
    color:#17324d;
    text-align:center;
}

/* =========================================================
   OPENING VIDEO
========================================================= */

#introScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#dff4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    overflow:auto;
}

.introBox{
    width:min(900px,100%);
    background:white;
    border-radius:28px;
    padding:18px;
    box-shadow:0 15px 45px rgba(30,80,120,.25);
}

.introLogo{
    width:130px;
    max-width:70%;
    height:auto;
    object-fit:contain;
    margin:5px auto 10px;
    display:block;
}

.introTitle{
    color:#1264a3;
    margin:5px 0;
    font-size:clamp(24px,5vw,38px);
}

.introSubtitle{
    color:#52708b;
    margin:5px 0 15px;
}

.videoFrame{
    width:100%;
    aspect-ratio:16/9;
    border-radius:20px;
    overflow:hidden;
    background:#102a43;
}

.videoFrame video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.videoButtons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:14px;
}

.videoBtn{
    border:none;
    padding:12px 22px;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.playVideo{
    background:#1479c9;
    color:white;
}

.skipVideo{
    background:#e9f5fc;
    color:#1264a3;
}

/* =========================================================
   HEADER
========================================================= */

header{
    background:white;
    padding:20px 15px;
    box-shadow:0 4px 20px rgba(30,90,130,.15);
}

.logo{
    width:150px;
    max-width:70%;
    height:auto;
    object-fit:contain;
    display:block;
    margin:0 auto 12px;
}

h1{
    margin:5px 0;
    color:#1264a3;
    font-size:clamp(24px,5vw,38px);
}

.subtitle{
    color:#5b748b;
    margin:8px 0;
}

/* =========================================================
   AUDIO CONTROL
========================================================= */

.audioBar{
    width:min(850px,94%);
    margin:18px auto;
    background:white;
    border-radius:20px;
    padding:14px;
    box-shadow:0 5px 18px rgba(30,90,130,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.audioBar button{
    border:none;
    border-radius:25px;
    padding:11px 20px;
    font-weight:bold;
    cursor:pointer;
}

.audioOn{
    background:#22a06b;
    color:white;
}

.audioOff{
    background:#edf3f7;
    color:#425b70;
}

#audioStatus{
    font-size:14px;
    color:#567086;
}

/* =========================================================
   MAIN
========================================================= */

.container{
    width:min(1200px,94%);
    margin:auto;
}

/* =========================================================
   CONNECTION
========================================================= */

.connectionBox{
    background:white;
    border-radius:20px;
    padding:15px;
    margin:18px 0;
    box-shadow:0 5px 18px rgba(30,90,130,.12);
}

.dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#f0a000;
    margin-right:7px;
}

.dot.good{
    background:#21a366;
}

.dot.bad{
    background:#e04444;
}

/* =========================================================
   STATUS
========================================================= */

.statusCard{
    background:white;
    padding:22px;
    border-radius:25px;
    margin:20px 0;
    box-shadow:0 7px 25px rgba(30,90,130,.13);
}

.statusCard h2{
    margin-top:0;
    color:#1264a3;
}

#dangerStatus{
    padding:18px;
    border-radius:18px;
    color:white;
    font-size:20px;
    font-weight:800;
    background:#f0a000;
}

.safe{
    background:#21a366 !important;
}

.warning{
    background:#f0a000 !important;
}

.danger{
    background:#e04444 !important;
    animation:dangerPulse 1s infinite;
}

@keyframes dangerPulse{
    50%{
        opacity:.65;
    }
}

/* =========================================================
   SENSOR CARDS
========================================================= */

.sensorGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin:20px 0;
}

.sensorCard{
    background:white;
    border-radius:24px;
    padding:22px 15px;
    box-shadow:0 7px 23px rgba(30,90,130,.12);
    transition:.2s;
    border:2px solid rgba(255,255,255,.8);
}

.sensorCard:hover{
    transform:translateY(-4px);
}

.sensorIcon{
    font-size:43px;
}

.sensorCard h3{
    color:#1264a3;
    margin:8px 0;
}

.sensorValue{
    font-size:35px;
    font-weight:800;
    color:#17324d;
}

.sensorUnit{
    color:#71879a;
    font-size:13px;
}

/* =========================================================
   LIVE INFORMATION
========================================================= */

.infoCard{
    background:white;
    border-radius:24px;
    padding:20px;
    margin:25px 0;
    box-shadow:0 7px 23px rgba(30,90,130,.12);
}

.infoGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.infoItem{
    background:#edf8fe;
    border-radius:16px;
    padding:14px;
}

.infoItem strong{
    display:block;
    color:#1264a3;
    margin-bottom:5px;
}

/* =========================================================
   GRAPHS
========================================================= */

.sectionTitle{
    color:#1264a3;
    margin:35px 0 18px;
    font-size:27px;
}

.graphGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.graphCard{
    background:white;
    padding:18px;
    border-radius:25px;
    box-shadow:0 7px 25px rgba(30,90,130,.13);
}

.graphCard h3{
    color:#1264a3;
    margin:5px 0 15px;
}

.chartBox{
    height:280px;
    position:relative;
}

/* =========================================================
   DIRECTION
========================================================= */

.directionCard{
    background:white;
    border-radius:25px;
    padding:23px;
    margin:28px 0;
    box-shadow:0 7px 25px rgba(30,90,130,.13);
}

.directionCard h2{
    color:#1264a3;
}

.directionMain{
    background:#e9f8ef;
    border:2px solid #b9e7ca;
    border-radius:20px;
    padding:20px;
    margin-top:15px;
}

.directionArrow{
    font-size:65px;
    margin:5px;
}

.directionText{
    font-size:20px;
    font-weight:800;
    color:#176b42;
}

.directionNote{
    color:#5f7788;
    line-height:1.6;
}

/* =========================================================
   SAFETY PROTOCOLS
========================================================= */

.protocolGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
}

.protocol{
    background:white;
    border-radius:22px;
    padding:20px;
    text-align:left;
    box-shadow:0 6px 20px rgba(30,90,130,.11);
}

.protocolIcon{
    font-size:35px;
}

.protocol h3{
    color:#1264a3;
    margin:8px 0;
}

.protocol p{
    color:#5e7486;
    line-height:1.55;
    margin-bottom:0;
}

/* =========================================================
   WARNING GUIDE
========================================================= */

.warningGuide{
    background:#fff7df;
    border:2px solid #f5d37a;
    border-radius:25px;
    padding:22px;
    margin:28px 0;
}

.warningGuide h2{
    color:#b36b00;
}

.warningList{
    text-align:left;
    max-width:800px;
    margin:auto;
    line-height:1.8;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    margin-top:35px;
    background:#1264a3;
    color:white;
    padding:30px 15px;
}

.developer{
    font-size:18px;
    font-weight:800;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width
