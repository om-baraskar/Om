<script>

/* =========================================================
   THINGSPEAK
   ========================================================= */

const CHANNEL_ID = "3456662";

/*
   FIELD ARRANGEMENT

   Field 1 = Distance
   Field 2 = Soil Moisture
   Field 3 = Vibration
   Field 4 = Rain
*/

const FIELD_DISTANCE = 1;
const FIELD_SOIL = 2;
const FIELD_VIBRATION = 3;
const FIELD_RAIN = 4;


/* =========================================================
   DANGER LIMITS
   ========================================================= */

/*
   SOIL CALIBRATION

   Your testing:

   Around 1850 = very wet / water
   Around 3382 = dry
   Around 4000+ = very dry

   Therefore:

   <= 2000       VERY WET / DANGER
   2001-2500     WET / WARNING
   2501-3000     MODERATE
   > 3000        DRY / SAFE
*/

const SOIL_DANGER = 2000;
const SOIL_WARNING = 2500;
const SOIL_NORMAL = 3000;


/*
   RAIN SENSOR

   Field 4 is ACTIVE.

   Based on your previous readings:

   Around 4095 = dry
   Around 1500 = wet
   Around 800 = very wet / heavy rain

   Therefore:

   <= 1000       HEAVY RAIN / DANGER
   1001-1500     WET / WARNING
   > 1500        DRYER / SAFE
*/

const RAIN_SENSOR_CONNECTED = true;

const RAIN_DANGER = 1000;
const RAIN_WARNING = 1500;


/*
   VIBRATION

   SW420:

   0 = no vibration
   1 = vibration detected
*/

const VIBRATION_DANGER = 1;


/*
   DISTANCE

   Distance at or below this value
   is treated as dangerous.

   Change this later if your physical
   sensor mounting requires another limit.
*/

const DISTANCE_DANGER = 20;


/* =========================================================
   DATA ARRAYS
   ========================================================= */

let soilData = [];
let distanceData = [];
let vibrationData = [];
let rainData = [];
let dateData = [];


/* =========================================================
   SIREN VARIABLES
   ========================================================= */

let sirenEnabled = false;
let alarmCurrentlyActive = false;
let audioContext = null;


/* =========================================================
   ENABLE MOBILE SIREN
   ========================================================= */

function enableSiren() {

    try {

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        audioContext.resume();

        sirenEnabled = true;

        document.getElementById("sirenBtn").textContent =
            "✓ SIREN ENABLED";

        document.getElementById("sirenBtn")
            .classList.add("on");

        document.getElementById("sirenStatus").textContent =
            "Siren armed. Any sensor reaching its danger limit can trigger the mobile speaker.";

    } catch (error) {

        console.error(error);

        document.getElementById("sirenStatus").textContent =
            "Audio could not be enabled on this browser.";

    }

}


/* =========================================================
   MOBILE SIREN
   ========================================================= */

function playSiren() {

    if (!sirenEnabled || !audioContext) {
        return;
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    const now = audioContext.currentTime;

    document.getElementById("sirenBox")
        .classList.add("alarm");

    for (let i = 0; i < 8; i++) {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "sawtooth";

        oscillator.frequency.setValueAtTime(
            430,
            now + i * 0.45
        );

        oscillator.frequency.linearRampToValueAtTime(
            780,
            now + i * 0.45 + 0.20
        );

        gain.gain.setValueAtTime(
            0.0001,
            now + i * 0.45
        );

        gain.gain.exponentialRampToValueAtTime(
            0.20,
            now + i * 0.45 + 0.04
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + i * 0.45 + 0.37
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now + i * 0.45);
        oscillator.stop(now + i * 0.45 + 0.40);

    }

    setTimeout(function() {

        document.getElementById("sirenBox")
            .classList.remove("alarm");

    }, 4000);

}


/* =========================================================
   EMERGENCY VOICE
   ========================================================= */

function emergencyVoice() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            "Attention. High danger detected. Do not panic. Follow the direction and move to safety. Stay away from unstable slopes and follow official instructions."
        );

    speech.rate = 0.9;
    speech.pitch = 1;
    speech.volume = 1;

    speechSynthesis.speak(speech);

}


/* =========================================================
   LOAD THINGSPEAK DATA
   ========================================================= */

async function loadData() {

    try {

        const url =
            `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=30`;

        const response =
            await fetch(url, {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "ThingSpeak connection failed: " +
                response.status
            );

        }

        const data =
            await response.json();

        if (!data.feeds || data.feeds.length === 0) {

            throw new Error(
                "No ThingSpeak data available"
            );

        }


        soilData = [];
        distanceData = [];
        vibrationData = [];
        rainData = [];
        dateData = [];


        data.feeds.forEach(function(feed) {

            const distance =
                parseFloat(
                    feed[`field${FIELD_DISTANCE}`]
                );

            const soil =
                parseFloat(
                    feed[`field${FIELD_SOIL}`]
                );

            const vibration =
                parseFloat(
                    feed[`field${FIELD_VIBRATION}`]
                );

            const rain =
                parseFloat(
                    feed[`field${FIELD_RAIN}`]
                );


            /*
               IMPORTANT:

               Invalid/missing values remain NaN
               instead of becoming 0.

               This prevents a missing sensor value
               from accidentally becoming DANGER.
            */

            distanceData.push(
                Number.isFinite(distance)
                    ? distance
                    : NaN
            );

            soilData.push(
                Number.isFinite(soil)
                    ? soil
                    : NaN
            );

            vibrationData.push(
                Number.isFinite(vibration)
                    ? vibration
                    : NaN
            );

            rainData.push(
                Number.isFinite(rain)
                    ? rain
                    : NaN
            );


            dateData.push(
                new Date(feed.created_at)
                    .toLocaleString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )
            );

        });


        const latest =
            data.feeds[
                data.feeds.length - 1
            ];


        const latestDistance =
            parseFloat(
                latest[`field${FIELD_DISTANCE}`]
            );

        const latestSoil =
            parseFloat(
                latest[`field${FIELD_SOIL}`]
            );

        const latestVibration =
            parseFloat(
                latest[`field${FIELD_VIBRATION}`]
            );

        const latestRain =
            parseFloat(
                latest[`field${FIELD_RAIN}`]
            );


        updateSensors(
            latestSoil,
            latestDistance,
            latestRain,
            latestVibration
        );


        drawGraph(
            "soilGraph",
            soilData.filter(Number.isFinite),
            dateData,
            "Soil"
        );

        drawGraph(
            "distanceGraph",
            distanceData.filter(Number.isFinite),
            dateData,
            "Distance",
            " cm"
        );

        drawGraph(
            "rainGraph",
            rainData.filter(Number.isFinite),
            dateData,
            "Rain"
        );

        drawGraph(
            "vibrationGraph",
            vibrationData.filter(Number.isFinite),
            dateData,
            "Vibration"
        );


        updateHistory(
            soilData,
            distanceData,
            rainData,
            vibrationData,
            dateData
        );


        document.getElementById("healthThing")
            .textContent = "✓ ONLINE";

        document.getElementById("healthThing")
            .className = "ok";


        document.getElementById("healthSoil")
            .textContent =
            Number.isFinite(latestSoil)
                ? "✓ RECEIVING"
                : "✕ NO DATA";

        document.getElementById("healthSoil")
            .className =
            Number.isFinite(latestSoil)
                ? "ok"
                : "bad";


        document.getElementById("healthDistance")
            .textContent =
            Number.isFinite(latestDistance)
                ? "✓ RECEIVING"
                : "✕ NO DATA";

        document.getElementById("healthDistance")
            .className =
            Number.isFinite(latestDistance)
                ? "ok"
                : "bad";


        /*
           RAIN SENSOR IS NOW ACTIVE.
        */

        document.getElementById("healthRain")
            .textContent =
            Number.isFinite(latestRain)
                ? "✓ RECEIVING"
                : "✕ NO DATA";

        document.getElementById("healthRain")
            .className =
            Number.isFinite(latestRain)
                ? "ok"
                : "bad";


        document.getElementById("healthVibration")
            .textContent =
            Number.isFinite(latestVibration)
                ? "✓ RECEIVING"
                : "✕ NO DATA";

        document.getElementById("healthVibration")
            .className =
            Number.isFinite(latestVibration)
                ? "ok"
                : "bad";


        document.getElementById("latestData")
            .textContent =
            dateData[dateData.length - 1] || "--";

    } catch (error) {

        console.error(
            "ThingSpeak error:",
            error
        );

        document.getElementById("healthThing")
            .textContent = "✕ OFFLINE";

        document.getElementById("healthThing")
            .className = "bad";

        document.getElementById("status")
            .textContent = "OFFLINE";

        document.getElementById("message")
            .textContent =
            "Unable to read live ThingSpeak data.";

    }

}


/* =========================================================
   UPDATE SENSOR DISPLAY
   ========================================================= */

function updateSensors(
    soil,
    distance,
    rain,
    vibration
) {

    document.getElementById("soil")
        .textContent =
        Number.isFinite(soil)
            ? soil.toFixed(0)
            : "--";

    document.getElementById("distance")
        .textContent =
        Number.isFinite(distance)
            ? distance.toFixed(1)
            : "--";

    document.getElementById("rainValue")
        .textContent =
        Number.isFinite(rain)
            ? rain.toFixed(0)
            : "--";

    document.getElementById("vibration")
        .textContent =
        Number.isFinite(vibration)
            ? vibration.toFixed(0)
            : "--";


    /*
       SOIL BAR

       Lower value = wetter.
    */

    if (Number.isFinite(soil)) {

        const soilRiskPercent =
            Math.max(
                0,
                Math.min(
                    100,
                    ((4095 - soil) / 4095) * 100
                )
            );

        document.getElementById("soilBar")
            .style.width =
            Math.max(5, soilRiskPercent) + "%";

    } else {

        document.getElementById("soilBar")
            .style.width = "5%";

    }


    /*
       DISTANCE BAR
    */

    if (Number.isFinite(distance)) {

        const distanceRiskPercent =
            distance > 0
                ? Math.max(
                    5,
                    Math.min(
                        100,
                        ((100 - Math.min(distance, 100)) / 100) * 100
                    )
                )
                : 5;

        document.getElementById("distanceBar")
            .style.width =
            distanceRiskPercent + "%";

    } else {

        document.getElementById("distanceBar")
            .style.width = "5%";

    }


    /*
       RAIN BAR
    */

    if (Number.isFinite(rain)) {

        const rainRiskPercent =
            Math.max(
                0,
                Math.min(
                    100,
                    ((4095 - rain) / 4095) * 100
                )
            );

        document.getElementById("rainBar")
            .style.width =
            Math.max(5, rainRiskPercent) + "%";

    } else {

        document.getElementById("rainBar")
            .style.width = "5%";

    }


    /*
       VIBRATION BAR
    */

    document.getElementById("vibrationBar")
        .style.width =
        Number.isFinite(vibration) &&
        vibration >= VIBRATION_DANGER
            ? "100%"
            : "5%";


    checkIndividualDanger(
        soil,
        distance,
        rain,
        vibration
    );

}


/* =========================================================
   INDIVIDUAL SENSOR DANGER LOGIC
   ========================================================= */

function checkIndividualDanger(
    soil,
    distance,
    rain,
    vibration
) {

    /*
       SOIL

       1850 = VERY WET / DANGER
       3382 = DRY / SAFE
    */

    const soilDanger =
        Number.isFinite(soil) &&
        soil > 0 &&
        soil <= SOIL_DANGER;


    /*
       RAIN

       FIELD 4 IS NOW ACTIVE.

       Around 4095 = dry
       Around 1500 = wet
       Around 800 = heavy rain

       Therefore <=1000 = danger.
    */

    const rainDanger =
        RAIN_SENSOR_CONNECTED &&
        Number.isFinite(rain) &&
        rain > 0 &&
        rain <= RAIN_DANGER;


    /*
       VIBRATION
    */

    const vibrationDanger =
        Number.isFinite(vibration) &&
        vibration >= VIBRATION_DANGER;


    /*
       DISTANCE
    */

    const distanceDanger =
        Number.isFinite(distance) &&
        distance > 0 &&
        distance <= DISTANCE_DANGER;


    /*
       ANY ONE SENSOR CAN TRIGGER DANGER.
    */

    const danger =
        soilDanger ||
        rainDanger ||
        vibrationDanger ||
        distanceDanger;


    const reasons = [];


    if (soilDanger) {

        reasons.push(
            "Dangerous soil moisture detected: " +
            soil +
            " (danger at " +
            SOIL_DANGER +
            " or below)"
        );

    }


    if (rainDanger) {

        reasons.push(
            "Heavy rain detected: " +
            rain +
            " (danger at " +
            RAIN_DANGER +
            " or below)"
        );

    }


    if (vibrationDanger) {

        reasons.push(
            "Ground vibration detected (" +
            vibration +
            ")"
        );

    }


    if (distanceDanger) {

        reasons.push(
            "Possible rock or slope movement: distance is " +
            distance.toFixed(1) +
            " cm (danger limit " +
            DISTANCE_DANGER +
            " cm)"
        );

    }


    updateReasonBoxes(
        soil,
        distance,
        rain,
        vibration,
        soilDanger,
        distanceDanger,
        rainDanger,
        vibrationDanger
    );


    if (danger) {

        setStatus(
            "HIGH DANGER",
            reasons.join(" • "),
            "danger"
        );

        activateEmergency(
            reasons.join(" • ")
        );

    } else {

        setStatus(
            "SAFE",
            "All sensor readings are currently within safe limits.",
            "safe"
        );

        alarmCurrentlyActive = false;

        document.getElementById("emergency")
            .classList.remove("active");

    }

}


/* =========================================================
   UPDATE REASON BOXES
   ========================================================= */

function updateReasonBoxes(
    soil,
    distance,
    rain,
    vibration,
    soilDanger,
    distanceDanger,
    rainDanger,
    vibrationDanger
) {

    document.getElementById("reasonSoil")
        .innerHTML =
        `<b>🌱 Soil Moisture</b><br>` +
        (
            !Number.isFinite(soil)
                ? `NO DATA: Soil moisture value is unavailable.`
                : soilDanger
                    ? `DANGER: Value ${soil}. Soil is VERY WET and has reached the danger limit of ${SOIL_DANGER}.`
                    : `SAFE: Value ${soil}. Values above ${SOIL_NORMAL} are treated as DRY/SAFE.`
        );


    /*
       RAIN IS ACTIVE.
    */

    document.getElementById("reasonRain")
        .innerHTML =
        `<b>🌧️ Rain</b><br>` +
        (
            !Number.isFinite(rain)
                ? `NO DATA: Rain sensor value is unavailable.`
                : rainDanger
                    ? `DANGER: Heavy rain detected. Value ${rain} is at or below ${RAIN_DANGER}.`
                    : rain > RAIN_DANGER &&
                      rain <= RAIN_WARNING
                        ? `WARNING: Wet/rain condition detected. Value ${rain} is between ${RAIN_DANGER + 1} and ${RAIN_WARNING}.`
                        : `SAFE: Rain sensor value is ${rain}.`
        );


    document.getElementById("reasonVibration")
        .innerHTML =
        `<b>📳 Vibration</b><br>` +
        (
            !Number.isFinite(vibration)
                ? `NO DATA: Vibration sensor value is unavailable.`
                : vibrationDanger
                    ? `DANGER: Ground vibration detected with value ${vibration}.`
                    : `SAFE: No dangerous vibration detected.`
        );


    document.getElementById("reasonDistance")
        .innerHTML =
        `<b>📏 Distance</b><br>` +
        (
            !Number.isFinite(distance)
                ? `NO DATA: Distance sensor value is unavailable.`
                : distanceDanger
                    ? `DANGER: Possible rock/slope movement. Distance ${distance.toFixed(1)} cm is within the ${DISTANCE_DANGER} cm danger range.`
                    : `SAFE: Distance is ${distance.toFixed(1)} cm, outside the ${DISTANCE_DANGER} cm danger range.`
        );

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    text,
    message,
    type
) {

    const status =
        document.getElementById("status");

    const msg =
        document.getElementById("message");

    const light =
        document.getElementById("light");


    status.textContent = text;
    msg.textContent = message;


    if (type === "danger") {

        status.style.color = "#d82d52";

        light.style.background = "#ed3f61";

        light.style.boxShadow =
            "0 0 35px #ed3f6188";

    } else {

        status.style.color = "#15945a";

        light.style.background = "#39d98a";

        light.style.boxShadow =
            "0 0 30px #39d98a88";

    }

}


/* =========================================================
   EMERGENCY ACTIVATION
   ========================================================= */

function activateEmergency(reason) {

    const emergency =
        document.getElementById("emergency");

    emergency.classList.add("active");

    document.getElementById("dangerText")
        .textContent =
        "HIGH DANGER: " +
        reason +
        ". Do not panic. Follow the direction and move to safety.";


    if (!alarmCurrentlyActive) {

        alarmCurrentlyActive = true;

        playSiren();

        emergencyVoice();

        addAlert(reason);

    }

}


/* =========================================================
   ALERT HISTORY
   ========================================================= */

let alertList = [];


function addAlert(reason) {

    const now =
        new Date().toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    alertList.unshift({
        time: now,
        reason: reason
    });


    alertList =
        alertList.slice(0, 8);


    renderAlerts();

}


function renderAlerts() {

    const box =
        document.getElementById("alerts");


    if (!alertList.length) {

        box.innerHTML =
            '<div class="alert">No alerts recorded yet.</div>';

        return;

    }


    box.innerHTML =
        alertList.map(function(alert) {

            return `
                <div class="alert">
                    <strong>⚠ HIGH DANGER</strong>
                    <br>
                    ${alert.reason}
                    <br>
                    ${alert.time}
                </div>
            `;

        }).join("");

}


/* =========================================================
   SENSOR HISTORY
   ========================================================= */

function updateHistory(
    soil,
    distance,
    rain,
    vibration,
    dates
) {

    renderHistory(
        "soilHistory",
        soil,
        dates
    );

    renderHistory(
        "distanceHistory",
        distance,
        dates
    );

    renderHistory(
        "rainHistory",
        rain,
        dates
    );

    renderHistory(
        "vibrationHistory",
        vibration,
        dates
    );

}


function renderHistory(
    id,
    values,
    dates
) {

    const box =
        document.getElementById(id);

    const start =
        Math.max(
            0,
            values.length - 6
        );

    box.innerHTML = "";


    for (
        let i = start;
        i < values.length;
        i++
    ) {

        const row =
            document.createElement("div");

        row.className =
            "historyitem";

        const value =
            Number.isFinite(values[i])
                ? Number(values[i]).toFixed(1)
                : "--";

        row.innerHTML =
            `
            <span>${dates[i] || "--"}</span>
            <span class="histvalue">
                ${value}
            </span>
            `;

        box.appendChild(row);

    }

}


/* =========================================================
   GRAPH
   ========================================================= */

function drawGraph(
    id,
    values,
    dates,
    label,
    unit = ""
) {

    const svg =
        document.getElementById(id);

    if (!svg || !values.length) {
        return;
    }

    svg.innerHTML = "";

    const W = 600;
    const H = 230;
    const L = 42;
    const R = 12;
    const T = 12;
    const B = 30;

    const gw = W - L - R;
    const gh = H - T - B;


    const cleanValues =
        values.filter(Number.isFinite);

    if (!cleanValues.length) {
        return;
    }


    let min =
        Math.min(...cleanValues);

    let max =
        Math.max(...cleanValues);

    if (min === max) {
        min -= 1;
        max += 1;
    }


    const pad =
        Math.max(
            (max - min) * 0.12,
            1
        );

    min -= pad;
    max += pad;


    for (
        let i = 0;
        i <= 4;
        i++
    ) {

        const y =
            T + gh * i / 4;

        const grid =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        grid.setAttribute("x1", L);
        grid.setAttribute("x2", W - R);
        grid.setAttribute("y1", y);
        grid.setAttribute("y2", y);
        grid.setAttribute("class", "grid");

        svg.appendChild(grid);

    }


    const points =
        cleanValues.map(function(value, index) {

            return {
                x:
                    L +
                    index /
                    Math.max(
                        cleanValues.length - 1,
                        1
                    ) *
                    gw,

                y:
                    T +
                    gh -
                    (value - min) /
                    (max - min) *
                    gh,

                v: value,

                date:
                    dates[index] || "--"
            };

        });


    const area =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polygon"
        );

    area.setAttribute(
        "points",
        [
            `${points[0].x},${H-B}`,
            ...points.map(
                p => `${p.x},${p.y}`
            ),
            `${points[points.length-1].x},${H-B}`
        ].join(" ")
    );

    area.setAttribute(
        "class",
        "area"
    );

    svg.appendChild(area);


    let path = "";

    points.forEach(function(p, index) {

        if (index === 0) {

            path =
                `M ${p.x} ${p.y}`;

        } else {

            const previous =
                points[index - 1];

            const middle =
                (previous.x + p.x) / 2;

            path +=
                ` C ${middle} ${previous.y},
                ${middle} ${p.y},
                ${p.x} ${p.y}`;

        }

    });


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    line.setAttribute(
        "d",
        path
    );

    line.setAttribute(
        "class",
        "line"
    );

    svg.appendChild(line);


    const holder =
        svg.parentElement;

    const tip =
        document.createElement("div");

    tip.className =
        "tip";

    holder.appendChild(tip);


    points.forEach(function(p, index) {

        const dot =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        dot.setAttribute("cx", p.x);
        dot.setAttribute("cy", p.y);

        dot.setAttribute(
            "r",
            index === points.length - 1
                ? 6
                : 4.5
        );

        dot.setAttribute(
            "class",
            "dot"
        );


        dot.addEventListener(
            "click",
            function() {

                tip.innerHTML =
                    `
                    <div>${p.date}</div>
                    <b>${Number(p.v).toFixed(2)}${unit}</b>
                    <div>${rating(p.v, label)}</div>
                    `;

                const rect =
                    svg.getBoundingClientRect();

                tip.style.left =
                    (
                        p.x /
                        W *
                        rect.width
                    ) + "px";

                tip.style.top =
                    (
                        p.y /
                        H *
                        rect.height
                    ) + "px";

                tip.classList.add(
                    "show"
                );

            }
        );

        svg.appendChild(dot);

    });


    const indexes =
        cleanValues.length <= 3
            ? [...Array(cleanValues.length).keys()]
            : [
                0,
                Math.floor(
                    (cleanValues.length - 1) / 2
                ),
                cleanValues.length - 1
            ];


    indexes.forEach(function(index) {

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        text.setAttribute(
            "x",
            points[index].x
        );

        text.setAttribute(
            "y",
            H - 7
        );

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "font-size",
            "10"
        );

        text.setAttribute(
            "fill",
            "#75867d"
        );

        text.textContent =
            dates[index] || "--";

        svg.appendChild(text);

    });

}


/* =========================================================
   GRAPH RATING
   ========================================================= */

function rating(
    value,
    label
) {

    if (label === "Distance") {

        if (
            value > 0 &&
            value <= DISTANCE_DANGER
        ) {

            return "🔴 POSSIBLE MOVEMENT / DANGER";

        }

        return "🟢 SAFE";

    }


    if (label === "Vibration") {

        return value >= VIBRATION_DANGER
            ? "🔴 VIBRATION DETECTED"
            : "🟢 SAFE";

    }


    if (label === "Rain") {

        if (
            value > 0 &&
            value <= RAIN_DANGER
        ) {

            return "🔴 HEAVY RAIN / DANGER";

        }

        if (
            value > RAIN_DANGER &&
            value <= RAIN_WARNING
        ) {

            return "🟠 WET / WARNING";

        }

        return "🟢 DRY / SAFE";

    }


    if (label === "Soil") {

        if (
            value > 0 &&
            value <= SOIL_DANGER
        ) {

            return "🔴 VERY WET / DANGER";

        }

        if (
            value > SOIL_DANGER &&
            value <= SOIL_WARNING
        ) {

            return "🟠 WET / WARNING";

        }

        if (
            value > SOIL_WARNING &&
            value <= SOIL_NORMAL
        ) {

            return "🟡 MODERATE MOISTURE";

        }

        return "🟢 DRY / SAFE";

    }


    return "🟢 SAFE";

}


/* =========================================================
   MOBILE ORIENTATION
   ========================================================= */

function orientation(event) {

    let heading;

    if (
        typeof event.webkitCompassHeading ===
        "number"
    ) {

        heading =
            event.webkitCompassHeading;

    } else if (
        typeof event.alpha ===
        "number"
    ) {

        heading =
            360 - event.alpha;

    }


    if (
        typeof heading === "number"
    ) {

        document.getElementById("arrow")
            .style.transform =
            `rotate(${heading}deg)`;

    }

}


/* =========================================================
   START
   ========================================================= */

loadData();

setInterval(
    loadData,
    15000
);

window.addEventListener(
    "deviceorientation",
    orientation,
    true
);

</script>
